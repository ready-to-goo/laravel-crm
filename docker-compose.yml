services:
  app:
    image: php:8.1-fpm
    working_dir: /var/www
    volumes:
      - ./:/var/www
    expose:
      - "9000"
    depends_on:
      - mysql
    networks:
      - krayin

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"  # Usando porta padrão
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - krayin

  mysql:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: krayin
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: krayin
      MYSQL_PASSWORD: krayin
    volumes:
      - db_data:/var/lib/mysql
    expose:
      - "3306"
    networks:
      - krayin

  redis:
    image: redis:alpine
    expose:
      - "6379"
    networks:
      - krayin

volumes:
  db_data:

networks:
  krayin:
